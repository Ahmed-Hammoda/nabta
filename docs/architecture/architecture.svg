<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#1F5FA8">Nabta – System Architecture</text>

  <!-- Cloud API (phase 2) -->
  <rect x="710" y="60" width="200" height="50" rx="8" fill="#F5F5F3" stroke="#888" stroke-dasharray="6 4"/>
  <text x="810" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#444">Cloud LLM API</text>
  <text x="810" y="100" text-anchor="middle" font-size="12" fill="#666">phase 2 – for comparison</text>

  <!-- Sensor node container -->
  <rect x="30" y="130" width="300" height="510" rx="16" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="180" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#085041">Sensor node (ESP32)</text>

  <rect x="50" y="175" width="260" height="120" rx="8" fill="#ffffff" stroke="#0F6E56"/>
  <text x="180" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sensors</text>
  <text x="70" y="222" font-size="12" fill="#333">• Soil moisture (capacitive)</text>
  <text x="70" y="240" font-size="12" fill="#333">• Air temperature &amp; humidity</text>
  <text x="70" y="258" font-size="12" fill="#333">• Light level</text>
  <text x="70" y="276" font-size="12" fill="#333">• Water tank level</text>

  <rect x="50" y="325" width="260" height="100" rx="8" fill="#ffffff" stroke="#0F6E56"/>
  <text x="180" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">ESP32 firmware</text>
  <text x="180" y="373" text-anchor="middle" font-size="12" fill="#333">Reads sensors every 30 s</text>
  <text x="180" y="391" text-anchor="middle" font-size="12" fill="#333">Executes pump commands</text>
  <text x="180" y="409" text-anchor="middle" font-size="12" fill="#A32D2D">Local pump timeout (failsafe)</text>

  <rect x="50" y="460" width="260" height="80" rx="8" fill="#ffffff" stroke="#0F6E56"/>
  <text x="180" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Relay + 5 V pump</text>
  <text x="180" y="512" text-anchor="middle" font-size="12" fill="#333">Waters the plant</text>

  <line x1="180" y1="295" x2="180" y2="321" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="180" y1="425" x2="180" y2="456" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Edge hub container -->
  <rect x="420" y="130" width="520" height="510" rx="16" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="680" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#3C3489">Edge hub (Raspberry Pi 5, 8 GB)</text>

  <rect x="450" y="175" width="200" height="70" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="550" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">MQTT broker</text>
  <text x="550" y="224" text-anchor="middle" font-size="12" fill="#333">Mosquitto</text>

  <rect x="450" y="290" width="200" height="95" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="550" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Backend server</text>
  <text x="550" y="338" text-anchor="middle" font-size="12" fill="#333">FastAPI · scheduler</text>
  <text x="550" y="356" text-anchor="middle" font-size="12" fill="#333">REST + WebSocket API</text>

  <rect x="450" y="440" width="200" height="80" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="550" y="468" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Database</text>
  <text x="550" y="490" text-anchor="middle" font-size="12" fill="#333">Readings · decisions · chat</text>

  <rect x="710" y="175" width="200" height="115" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="810" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">AI assistant</text>
  <text x="810" y="224" text-anchor="middle" font-size="12" fill="#333">Small language model</text>
  <text x="810" y="242" text-anchor="middle" font-size="12" fill="#333">(local, via Ollama)</text>
  <text x="810" y="266" text-anchor="middle" font-size="12" fill="#333">+ plant knowledge base</text>

  <rect x="710" y="330" width="200" height="90" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="810" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Safety layer</text>
  <text x="810" y="379" text-anchor="middle" font-size="12" fill="#712B13">Hard rules</text>
  <text x="810" y="397" text-anchor="middle" font-size="12" fill="#712B13">always have the final say</text>

  <!-- Dashboard / user -->
  <rect x="1000" y="290" width="175" height="105" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="1087" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Web dashboard</text>
  <text x="1087" y="342" text-anchor="middle" font-size="12" fill="#0C447C">Plant status · history</text>
  <text x="1087" y="360" text-anchor="middle" font-size="12" fill="#0C447C">Watering log · chat</text>

  <rect x="1000" y="470" width="175" height="60" rx="8" fill="#F5F5F3" stroke="#888"/>
  <text x="1087" y="497" text-anchor="middle" font-size="14" font-weight="600" fill="#444">User</text>
  <text x="1087" y="515" text-anchor="middle" font-size="12" fill="#666">Phone or laptop</text>

  <!-- ESP32 <-> broker -->
  <path d="M310 345 L375 345 L375 195 L446 195" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="187" font-size="12" fill="#0F6E56">sensor data</text>
  <path d="M450 225 L400 225 L400 400 L314 400" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="338" y="425" font-size="12" fill="#993C1D">commands</text>
  <text x="338" y="441" font-size="12" fill="#666">(MQTT)</text>

  <!-- broker <-> backend, backend <-> db -->
  <line x1="550" y1="245" x2="550" y2="286" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="550" y1="385" x2="550" y2="436" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- backend -> AI -->
  <path d="M650 310 L680 310 L680 225 L706 225" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- AI -> safety -->
  <line x1="810" y1="290" x2="810" y2="326" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="818" y="313" font-size="12" fill="#3C3489">proposed action</text>
  <!-- safety -> backend -->
  <path d="M710 345 L654 345" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cloud -> AI (phase 2) -->
  <line x1="810" y1="110" x2="810" y2="171" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#ag)" marker-end="url(#ag)"/>

  <!-- backend <-> dashboard -->
  <path d="M650 372 L690 372 L690 470 L960 470 L960 345 L996 345" fill="none" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="825" y="462" text-anchor="middle" font-size="12" fill="#185FA5">live data · chat messages</text>
  <!-- dashboard <-> user -->
  <line x1="1087" y1="395" x2="1087" y2="466" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>


  <!-- Legend -->
  <line x1="60" y1="690" x2="110" y2="690" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="120" y="694" font-size="12" fill="#333">Data / commands</text>
  <line x1="260" y1="690" x2="310" y2="690" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="320" y="694" font-size="12" fill="#333">Phase 2 (cloud API comparison)</text>
  <rect x="540" y="680" width="18" height="18" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="566" y="694" font-size="12" fill="#333">Safety-critical</text>
  <text x="1170" y="694" text-anchor="end" font-size="12" fill="#888">Everything runs locally – no internet needed in phase 1</text>
</svg>
