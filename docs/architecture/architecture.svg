<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#1F5FA8">Nabta – Option 1: everything on the Raspberry Pi</text>

  <!-- Cloud API (phase 2) -->
  <rect x="660" y="60" width="220" height="50" rx="8" fill="#F5F5F3" stroke="#888" stroke-dasharray="6 4"/>
  <text x="770" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#444">Cloud LLM API</text>
  <text x="770" y="100" text-anchor="middle" font-size="12" fill="#666">phase 2 – for comparison</text>

  <!-- Physical devices -->
  <rect x="40" y="170" width="250" height="140" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="165" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sensors</text>
  <text x="60" y="222" font-size="12" fill="#085041">• Soil moisture (capacitive)</text>
  <text x="60" y="242" font-size="12" fill="#085041">• Air temperature &amp; humidity</text>
  <text x="60" y="262" font-size="12" fill="#085041">• Light level</text>
  <text x="60" y="282" font-size="12" fill="#085041">• Water tank level</text>

  <rect x="40" y="420" width="250" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="165" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Relay + 5 V pump</text>
  <text x="165" y="478" text-anchor="middle" font-size="12" fill="#085041">Waters the plant</text>

  <!-- Raspberry Pi container -->
  <rect x="350" y="130" width="560" height="510" rx="16" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="630" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#3C3489">Raspberry Pi</text>

  <rect x="380" y="175" width="220" height="110" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="490" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Hardware control</text>
  <text x="490" y="223" text-anchor="middle" font-size="12" fill="#333">Reads sensors every 30 s</text>
  <text x="490" y="241" text-anchor="middle" font-size="12" fill="#333">Drives the pump</text>
  <text x="490" y="263" text-anchor="middle" font-size="12" fill="#A32D2D">Pump timeout (failsafe)</text>

  <rect x="380" y="330" width="220" height="95" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="490" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Backend server</text>
  <text x="490" y="379" text-anchor="middle" font-size="12" fill="#333">Decision scheduler</text>
  <text x="490" y="397" text-anchor="middle" font-size="12" fill="#333">API for the dashboard</text>

  <rect x="380" y="480" width="220" height="80" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="490" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Database</text>
  <text x="490" y="530" text-anchor="middle" font-size="12" fill="#333">Readings · decisions · chat</text>

  <rect x="660" y="175" width="220" height="115" rx="8" fill="#ffffff" stroke="#534AB7"/>
  <text x="770" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">AI assistant</text>
  <text x="770" y="224" text-anchor="middle" font-size="12" fill="#333">Small language model</text>
  <text x="770" y="242" text-anchor="middle" font-size="12" fill="#333">(runs locally)</text>
  <text x="770" y="266" text-anchor="middle" font-size="12" fill="#333">+ plant knowledge base</text>

  <rect x="660" y="330" width="220" height="90" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="770" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Safety layer</text>
  <text x="770" y="379" text-anchor="middle" font-size="12" fill="#712B13">Hard rules</text>
  <text x="770" y="397" text-anchor="middle" font-size="12" fill="#712B13">always have the final say</text>

  <!-- Dashboard / user -->
  <rect x="980" y="290" width="190" height="105" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="1075" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Web dashboard</text>
  <text x="1075" y="342" text-anchor="middle" font-size="12" fill="#0C447C">Plant status · history</text>
  <text x="1075" y="360" text-anchor="middle" font-size="12" fill="#0C447C">Watering log · chat</text>

  <rect x="980" y="470" width="190" height="60" rx="8" fill="#F5F5F3" stroke="#888"/>
  <text x="1075" y="497" text-anchor="middle" font-size="14" font-weight="600" fill="#444">User</text>
  <text x="1075" y="515" text-anchor="middle" font-size="12" fill="#666">Phone or laptop</text>

  <!-- Sensors -> hardware control -->
  <line x1="290" y1="230" x2="376" y2="230" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="296" y="220" font-size="12" fill="#0F6E56">GPIO · I²C</text>
  <!-- hardware control -> pump -->
  <path d="M380 265 L320 265 L320 465 L294 465" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- hardware <-> backend, backend <-> db -->
  <line x1="490" y1="285" x2="490" y2="326" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="490" y1="425" x2="490" y2="476" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- backend -> AI -->
  <path d="M600 350 L630 350 L630 230 L656 230" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- AI -> safety -->
  <line x1="770" y1="290" x2="770" y2="326" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="778" y="313" font-size="12" fill="#3C3489">proposed action</text>
  <!-- safety -> backend -->
  <line x1="660" y1="395" x2="604" y2="395" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cloud -> AI (phase 2) -->
  <line x1="770" y1="110" x2="770" y2="171" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#ag)" marker-end="url(#ag)"/>

  <!-- backend <-> dashboard -->
  <path d="M600 412 L640 412 L640 600 L945 600 L945 345 L976 345" fill="none" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="792" y="590" text-anchor="middle" font-size="12" fill="#185FA5">live data · chat messages</text>
  <!-- dashboard <-> user -->
  <line x1="1075" y1="395" x2="1075" y2="466" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Legend -->
  <line x1="60" y1="690" x2="110" y2="690" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="120" y="694" font-size="12" fill="#333">Data / commands</text>
  <line x1="260" y1="690" x2="310" y2="690" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="320" y="694" font-size="12" fill="#333">Phase 2 (cloud API comparison)</text>
  <rect x="540" y="680" width="18" height="18" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="566" y="694" font-size="12" fill="#333">Safety-critical</text>
  <text x="1170" y="694" text-anchor="end" font-size="12" fill="#888">Everything runs locally – no internet needed in phase 1</text>
</svg>
